<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Compressor – Develac</title>

  <style>
    *{
      box-sizing:border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at top, #0b1630, #050a18);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .container{
      max-width:420px;
      width:100%;
      text-align:center;
    }

    h1{
      font-size:30px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#9ca3af;
      font-size:15px;
      margin-bottom:32px;
    }

    /* DROP ZONE */
    .drop-zone{
      border:2px dashed rgba(255,255,255,.25);
      border-radius:20px;
      padding:36px 20px;
      margin-bottom:20px;
      position:relative;
      cursor:pointer;
      transition:.25s;
    }

    .drop-zone:hover{
      border-color:#3b82f6;
    }

    .drop-zone input{
      display:none;
    }

    .file-icon{
      font-size:40px;
      margin-bottom:12px;
    }

    .drop-title{
      font-size:16px;
      margin-bottom:4px;
    }

    .drop-sub{
      font-size:13px;
      color:#9ca3af;
    }

    /* BUTTON */
    .compress-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:999px;
      background:#3b82f6;
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:.25s;
      opacity:.5;
    }

    .compress-btn.enabled{
      opacity:1;
    }

    .compress-btn:disabled{
      cursor:not-allowed;
    }

    /* FOOTER */
    .back{
      display:block;
      margin-top:22px;
      color:#9ca3af;
      text-decoration:none;
      font-size:14px;
    }

    .note{
      margin-top:14px;
      font-size:12px;
      color:#6b7280;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>PDF Compressor</h1>
    <div class="subtitle">
      Compress your PDF files securely without losing quality
    </div>

    <!-- DROP ZONE -->
    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="application/pdf"/>
      <div class="file-icon">📄</div>
      <div class="drop-title">Drag & drop your PDF here</div>
      <div class="drop-sub">or tap to select file</div>
    </label>

    <!-- BUTTON -->
    <button class="compress-btn" id="compressBtn" disabled>
      Compress PDF
    </button>

    <!-- FOOTER -->
    <a href="/" class="back">← Back to Home</a>
    <div class="note">Tool UI ready • Compression coming next</div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const compressBtn = document.getElementById('compressBtn');
    const dropZone = document.getElementById('dropZone');

    // Enable button on file select
    fileInput.addEventListener('change', () => {
      if(fileInput.files.length > 0){
        compressBtn.disabled = false;
        compressBtn.classList.add('enabled');
      }
    });

    // Fake compression flow
    compressBtn.addEventListener('click', () => {
      compressBtn.innerText = 'Compressing...';
      compressBtn.disabled = true;

      setTimeout(() => {
        compressBtn.innerText = 'Download PDF';

        const link = document.createElement('a');
        link.href = '/compressed.pdf';   // dummy file
        link.download = 'compressed.pdf';
        link.click();
      }, 2000);
    });
  </script>
</body>
</html>
