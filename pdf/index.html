<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Compressor – Develac</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1630,#050a18);
  color:#fff;
  display:flex;
  justify-content:center;
  padding:24px;
}

.container{
  max-width:420px;
  width:100%;
  text-align:center;
  margin-top:60px;
}

h1{
  font-size:30px;
  margin-bottom:10px;
}

.subtitle{
  color:#9ca3af;
  font-size:15px;
  margin-bottom:40px;
}

/* UPLOAD CARD */
.upload-card{
  background:rgba(255,255,255,0.03);
  border:2px dashed rgba(255,255,255,0.25);
  border-radius:24px;
  padding:36px 20px;
  cursor:pointer;
  transition:.25s;
}

.upload-card:hover{
  border-color:#3b82f6;
  background:rgba(59,130,246,0.05);
}

.upload-card input{
  display:none;
}

.upload-icon{
  font-size:42px;
  margin-bottom:14px;
}

.upload-title{
  font-size:16px;
  margin-bottom:6px;
}

.upload-sub{
  font-size:13px;
  color:#9ca3af;
}

/* BUTTON */
.compress-btn{
  margin-top:28px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:999px;
  background:#3b82f6;
  color:#fff;
  font-size:16px;
  font-weight:600;
  opacity:.5;
}

.compress-btn.enabled{
  opacity:1;
}

/* FOOTER */
.back{
  display:block;
  margin-top:26px;
  color:#9ca3af;
  text-decoration:none;
  font-size:14px;
}

.note{
  margin-top:14px;
  font-size:12px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="container">

  <h1>PDF Compressor</h1>
  <div class="subtitle">
    Compress your PDF files securely without losing quality
  </div>

  <!-- UPLOAD -->
  <label class="upload-card">
    <input type="file" id="fileInput" accept="application/pdf">
    <div class="upload-icon">📄</div>
    <div class="upload-title">Drag & drop your PDF here</div>
    <div class="upload-sub">or tap to select file</div>
  </label>

  <button class="compress-btn" id="compressBtn" disabled>
    Compress PDF
  </button>

  <a href="/" class="back">← Back to Home</a>
  <div class="note">UI ready • Backend coming next</div>

</div>

<script>
const fileInput = document.getElementById('fileInput');
const btn = document.getElementById('compressBtn');

fileInput.addEventListener('change',()=>{
  if(fileInput.files.length){
    btn.disabled = false;
    btn.classList.add('enabled');
  }
});
</script>

</body>
</html>
