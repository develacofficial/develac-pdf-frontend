<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Processing — Develac PDF</title>
<style>
body{
  background:#020617;color:#e5e7eb;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;font-family:system-ui
}
.card{
  background:#0f172a;padding:40px;
  border-radius:20px;text-align:center;
  width:320px
}
.progress{
  width:80px;height:80px;border-radius:50%;
  border:6px solid #1f2937;
  border-top-color:#3b82f6;
  animation:spin 1s linear infinite;
  margin:auto  auto 20px
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
<div class="progress"></div>
<p>Compressing securely on our servers…</p>

<!-- ADS PLACEHOLDER -->
<div style="margin-top:20px;font-size:13px;color:#9ca3af">
Ads will appear here
</div>
</div>

<script>
(async function () {
  try {
    // 1. get data from previous page
    const file = sessionStorage.getItem("pdfFile");
    const level = sessionStorage.getItem("level") || "medium";

    if (!file) {
      alert("No PDF found. Please upload again.");
      window.location.href = "index.html";
      return;
    }

    // 2. convert back to File object
    const response = await fetch(file);
    const blob = await response.blob();
    const pdfFile = new File([blob], "input.pdf", { type: "application/pdf" });

    // 3. prepare form data
    const formData = new FormData();
    formData.append("pdf", pdfFile);
    formData.append("level", level);

    // 4. send to backend
    const res = await fetch(
      "https://develac-pdf-backend-production.up.railway.app/compress",
      {
        method: "POST",
        body: formData
      }
    );

    if (!res.ok) throw new Error("Backend error");

    // 5. get compressed PDF
    const compressedBlob = await res.blob();

    // 6. store result for success page
    const downloadUrl = URL.createObjectURL(compressedBlob);
    sessionStorage.setItem("compressedPdf", downloadUrl);

    // 7. go to success page
    window.location.href = "success.html";

  } catch (err) {
    alert("Compression failed. Please try again.");
    window.location.href = "index.html";
  }
})();
      </script>

</body>
</html>
