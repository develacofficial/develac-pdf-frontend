<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Develac PDF — Compress PDFs Instantly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1220,#020617);
  color:#e5e7eb;
}

.container{
  max-width:960px;
  margin:auto;
  padding:40px 16px 80px;
}

/* HERO */
.hero{
  text-align:center;
  margin-bottom:40px;
}
.brand{
  font-weight:600;
  opacity:.9;
  margin-bottom:10px;
}
.hero h1{
  font-size:40px;
  line-height:1.2;
}
.hero p{
  color:#9ca3af;
  margin-top:8px;
}

/* CARD */
.card{
  max-width:520px;
  margin:0 auto 48px;
  background:rgba(15,23,42,.7);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* UPLOAD BOX */
.upload-box{
  position:relative;
  border:2px dashed #3b82f6;
  border-radius:16px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}
.upload-box:hover{
  background:rgba(59,130,246,.08);
}

/* FILE INPUT (REAL CLICK TARGET) */
.file-input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
  z-index:2;
}

/* REMOVE BUTTON */
.remove-btn{
  position:absolute;
  top:12px;
  right:12px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(59,130,246,.5);
  background:transparent;
  color:#3b82f6;
  font-size:16px;
  cursor:pointer;
  display:none;
  z-index:3;
}
.upload-box.has-file .remove-btn{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ICON */
.upload-icon{
  width:56px;
  height:56px;
  border-radius:50%;
  background:rgba(59,130,246,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 14px;
}
.upload-icon svg{
  width:26px;
  height:26px;
  stroke:#3b82f6;
}

/* TEXT */
.upload-text strong{
  display:block;
  font-size:16px;
}
.upload-text span{
  font-size:14px;
  color:#9ca3af;
}

/* LEVEL */
.level-box{margin-top:20px;}
.level-option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:14px;
  background:#0f172a;
  border:1px solid #1f2937;
  cursor:pointer;
}
.level-option.active{
  border-color:#3b82f6;
  background:rgba(59,130,246,.15);
}
.check{opacity:0;color:#3b82f6;font-weight:600;}
.level-option.active .check{opacity:1;}

/* BUTTON */
#compressBtn{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:16px;
  background:#1f2937;
  color:#9ca3af;
  cursor:not-allowed;
}
#compressBtn.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  cursor:pointer;
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#9ca3af;
}

/* MOBILE */
@media(max-width:640px){
  .hero h1{font-size:28px;}
}
</style>
</head>

<body>
<div class="container">

  <div class="hero">
    <div class="brand">Develac PDF</div>
    <h1>Compress PDFs instantly</h1>
    <p>Fast, secure, no sign-up required.</p>
  </div>

  <div class="card">

    <div class="upload-box" id="uploadBox">

      <input type="file" id="pdf" class="file-input" accept="application/pdf">

      <button class="remove-btn" id="removePdf" type="button">×</button>

      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M12 16V4"/>
          <path d="M7 9l5-5 5 5"/>
          <path d="M4 20h16"/>
        </svg>
      </div>

      <div class="upload-text" id="uploadText">
        <strong>Upload your PDF</strong>
        <span>Drag & drop or tap to browse</span>
      </div>

    </div>

    <div class="level-box">
      <div class="level-option active" data="medium">
        <span>Medium — Recommended</span>
        <span class="check">✓</span>
      </div>
      <div class="level-option" data="low">
        <span>Low — Highest quality</span>
        <span class="check">✓</span>
      </div>
      <div class="level-option" data="high">
        <span>High — Smallest size</span>
        <span class="check">✓</span>
      </div>
    </div>

    <button id="compressBtn">Compress & Download</button>
    <div class="status" id="status"></div>

  </div>
</div>

<script>
const pdf = document.getElementById("pdf");
const uploadBox = document.getElementById("uploadBox");
const uploadText = document.getElementById("uploadText");
const removeBtn = document.getElementById("removePdf");
const btn = document.getElementById("compressBtn");
const status = document.getElementById("status");

let level = "medium";

/* level select */
document.querySelectorAll(".level-option").forEach(opt=>{
  opt.addEventListener("click",()=>{
    document.querySelectorAll(".level-option").forEach(o=>o.classList.remove("active"));
    opt.classList.add("active");
    level = opt.dataset.value || opt.getAttribute("data");
  });
});

/* file select */
pdf.addEventListener("change",()=>{
  if(!pdf.files.length) return;
  const f = pdf.files[0];

  uploadText.innerHTML = `
    <strong>${f.name}</strong>
    <span>${(f.size/1024/1024).toFixed(2)} MB</span>
  `;
  uploadBox.classList.add("has-file");
  btn.classList.add("active");
  btn.disabled = false;
});

/* remove */
removeBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  pdf.value="";
  uploadBox.classList.remove("has-file");
  uploadText.innerHTML=`<strong>Upload your PDF</strong><span>Drag & drop or tap to browse</span>`;
  btn.classList.remove("active");
  btn.disabled=true;
});

/* compress */
btn.addEventListener("click",()=>{
  if(!pdf.files.length) return;
  status.innerText="Compressing PDF…";

  const fd=new FormData();
  fd.append("pdf",pdf.files[0]);
  fd.append("level",level);

  fetch("https://develac-pdf-backend-production.up.railway.app/compress",{
    method:"POST",
    body:fd
  })
  .then(r=>r.blob())
  .then(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="compressed.pdf";
    a.click();
    URL.revokeObjectURL(url);
    status.innerText="Download started ✔";
  })
  .catch(()=>status.innerText="Compression failed");
});
</script>

</body>
</html>
