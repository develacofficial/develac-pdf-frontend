<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Develac PDF — Compress PDFs Instantly</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body{
      min-height:100vh;
      background:radial-gradient(circle at top,#0b1220,#020617);
      color:#e5e7eb;
    }

    .container{
      max-width:720px;
      margin:auto;
      padding:40px 16px 80px;
    }

    .hero{
      text-align:center;
      margin-bottom:32px;
    }

    .hero h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .hero p{
      color:#9ca3af;
    }

    .card{
      background:rgba(15,23,42,.7);
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      padding:24px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }

    /* Upload box */
    .upload-box{
      position:relative;
      border:2px dashed #3b82f6;
      border-radius:16px;
      padding:32px 20px;
      text-align:center;
      cursor:pointer;
      margin-bottom:20px;
    }

    .upload-box input{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .upload-text strong{
      display:block;
      margin-bottom:6px;
      font-size:16px;
    }

    .upload-text span{
      font-size:14px;
      color:#9ca3af;
    }

    /* Levels */
    .level-option{
      display:flex;
      justify-content:space-between;
      padding:14px 16px;
      border-radius:14px;
      background:#0f172a;
      border:1px solid #1f2937;
      margin-bottom:10px;
      cursor:pointer;
    }

    .level-option.active{
      border-color:#3b82f6;
      background:rgba(59,130,246,.15);
    }

    .check{
      opacity:0;
      color:#3b82f6;
      font-weight:600;
    }

    .level-option.active .check{
      opacity:1;
    }

    /* Button */
    #compressBtn{
      width:100%;
      padding:16px;
      border-radius:14px;
      border:none;
      font-size:16px;
      font-weight:600;
      background:#1f2937;
      color:#9ca3af;
      cursor:not-allowed;
      margin-top:14px;
    }

    #compressBtn.active{
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:#fff;
      cursor:pointer;
    }

    .status{
      margin-top:14px;
      text-align:center;
      font-size:14px;
      color:#9ca3af;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>Compress PDFs instantly</h1>
    <p>Fast, secure, no sign-up required.</p>
  </div>

  <div class="card">

    <!-- Upload -->
    <div class="upload-box">
      <input type="file" id="pdf" accept="application/pdf">
      <div class="upload-text" id="uploadText">
        <strong>Upload your PDF</strong>
        <span>Tap to browse</span>
      </div>
    </div>

    <!-- Levels -->
    <div class="level-option active" data-level="medium">
      <span>Medium — Recommended</span>
      <span class="check">✓</span>
    </div>

    <div class="level-option" data-level="low">
      <span>Low — Highest quality</span>
      <span class="check">✓</span>
    </div>

    <div class="level-option" data-level="high">
      <span>High — Smallest size</span>
      <span class="check">✓</span>
    </div>

    <!-- Button -->
    <button id="compressBtn">Compress & Download</button>

    <div class="status" id="status"></div>

  </div>
</div>

<script>
const pdf = document.getElementById("pdf");
const uploadText = document.getElementById("uploadText");
const compressBtn = document.getElementById("compressBtn");
const status = document.getElementById("status");

let level = "medium";

/* Level select FIX */
document.querySelectorAll(".level-option").forEach(option => {
  option.addEventListener("click", () => {
    document.querySelectorAll(".level-option")
      .forEach(o => o.classList.remove("active"));

    option.classList.add("active");
    level = option.getAttribute("data-level");
  });
});

/* File select */
pdf.addEventListener("change", () => {
  if (!pdf.files.length) return;

  const f = pdf.files[0];
  uploadText.innerHTML = `
    <strong>${f.name}</strong>
    <span>${(f.size/1024/1024).toFixed(2)} MB</span>
  `;

  compressBtn.classList.add("active");
  compressBtn.disabled = false;
  status.innerText = "";
});

/* Compress FIX */
compressBtn.addEventListener("click", () => {
  if (!pdf.files.length) {
    alert("Please select a PDF first");
    return;
  }

  const formData = new FormData();
  formData.append("pdf", pdf.files[0]);
  formData.append("level", level);

  status.innerText = "Compressing PDF...";
  compressBtn.disabled = true;

  fetch("https://develac-pdf-backend-production.up.railway.app/compress", {
    method: "POST",
    body: formData
  })
  .then(res => {
    if (!res.ok) throw new Error();
    return res.blob();
  })
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "compressed.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    status.innerText = "PDF compressed & downloaded ✔";
    compressBtn.disabled = false;
  })
  .catch(() => {
    status.innerText = "Compression failed. Try again.";
    compressBtn.disabled = false;
  });
});
</script>

</body>
</html>
