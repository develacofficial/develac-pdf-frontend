<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Develac PDF Compressor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #020617;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 15px;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Develac PDF Compressor</h2>

    <input type="file" id="pdfFile" accept="application/pdf" />

    <button onclick="uploadPDF()">Compress PDF</button>

    <p id="status"></p>
  </div>

  <script>
    async function uploadPDF() {
      const fileInput = document.getElementById("pdfFile");
      const status = document.getElementById("status");

      if (!fileInput.files.length) {
        status.innerText = "❌ Please select a PDF file";
        return;
      }

      const formData = new FormData();
      // IMPORTANT: backend "pdf" field expect karta hai
      formData.append("pdf", fileInput.files[0]);

      status.innerText = "⏳ Uploading & compressing...";

      try {
        const response = await fetch(
          "https://develac-pdf-backend-production.up.railway.app/compress",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error("Backend error");
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "compressed.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.innerText = "✅ PDF compressed & downloaded!";
      } catch (error) {
        status.innerText = "❌ Error connecting backend";
      }
    }
  </script>
</body>
</html>
