
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Develac — Smart & Secure PDF Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#050b18,#020617);
  color:#e5e7eb;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 16px 120px;
}

/* HERO */
.hero{
  text-align:center;
  margin-bottom:70px;
}
.brand{
  font-weight:600;
  opacity:.9;
  margin-bottom:10px;
}
.hero h1{
  font-size:42px;
  margin-bottom:12px;
}
.hero p{
  color:#9ca3af;
  font-size:17px;
}

/* TOOLS */
.tools-title{
  text-align:center;
  margin-bottom:40px;
}
.tools-title h2{
  font-size:28px;
}
.tools-title p{
  color:#9ca3af;
  margin-top:6px;
}

/* GRID */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:32px 18px;
  justify-items:center;
}

/* TOOL CARD */
.tool{
  text-align:center;
  cursor:pointer;
  transition:.25s ease;
}
.tool:hover{
  transform:translateY(-4px);
}

/* ICON CIRCLE */
.tool-icon{
  width:88px;
  height:88px;
  border-radius:50%;
  background:linear-gradient(145deg,#0f1c35,#0a1226);
  box-shadow:
    0 10px 30px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.05);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
}

.tool-icon svg{
  width:36px;
  height:36px;
  stroke:#60a5fa;
}

/* NAME */
.tool-name{
  font-size:14px;
  font-weight:500;
}

/* DISABLED */
.disabled{
  opacity:.45;
  pointer-events:none;
}

/* FOOTER */
footer{
  margin-top:120px;
  text-align:center;
  font-size:14px;
  color:#6b7280;
}
</style>
</head>

<body>
<div class="container">

  <!-- HERO -->
  <section class="hero">
    <div class="brand">Develac</div>
    <h1>Smart & Secure PDF Tools</h1>
    <p>Fast, private and professional tools for modern workflows.</p>
  </section>

  <!-- TOOLS -->
  <section>
    <div class="tools-title">
      <h2>Our Tools</h2>
      <p>Designed for speed, privacy, and reliability</p>
    </div>

    <div class="tools-grid">

      <!-- PDF COMPRESSOR -->
      <a href="/pdf" class="tool" style="text-decoration:none;color:inherit;">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M12 16V4"/>
            <path d="M7 9l5-5 5 5"/>
            <path d="M4 20h16"/>
          </svg>
        </div>
        <div class="tool-name">PDF Compressor</div>
      </a>

      <!-- MERGER -->
      <div class="tool disabled">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M8 7h8"/>
            <path d="M8 12h8"/>
            <path d="M8 17h8"/>
          </svg>
        </div>
        <div class="tool-name">PDF Merger</div>
      </div>

      <!-- PDF TO IMAGE -->
      <div class="tool disabled">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <div class="tool-name">PDF to Image</div>
      </div>

      <!-- PDF TO WORD -->
      <div class="tool disabled">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M4 4h16v16H4z"/>
            <path d="M8 9h8"/>
            <path d="M8 13h8"/>
          </svg>
        </div>
        <div class="tool-name">PDF to Word</div>
      </div>

      <!-- MORE -->
      <div class="tool disabled">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M12 6v12"/>
            <path d="M6 12h12"/>
          </svg>
        </div>
        <div class="tool-name">More tools</div>
      </div>

    </div>
  </section>

  <footer>
    © 2026 Develac — Smart & Secure Software Tools
  </footer>

</div>
</body>
</html>
