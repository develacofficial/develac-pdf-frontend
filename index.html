<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Develac PDF — Compress PDFs Instantly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1220,#020617);
  color:#e5e7eb;
}

.container{
  max-width:960px;
  margin:auto;
  padding:40px 16px 80px;
}

.hero{
  text-align:center;
  margin-bottom:40px;
}

.brand{
  opacity:.9;
  font-weight:600;
  margin-bottom:10px;
}

.hero h1{
  font-size:40px;
  margin-bottom:10px;
}

.hero p{
  color:#9ca3af;
}

.card{
  max-width:520px;
  margin:0 auto 40px;
  background:rgba(15,23,42,.7);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* UPLOAD BOX */
.upload-box{
  position:relative;
  border:2px dashed #3b82f6;
  border-radius:16px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.upload-box:hover{
  background:rgba(59,130,246,.08);
}

/* FILE INPUT (REAL FIX) */
.upload-box input[type=file]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

/* REMOVE BUTTON */
.remove-btn{
  position:absolute;
  top:12px;
  right:12px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(59,130,246,.5);
  background:transparent;
  color:#3b82f6;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  display:none;
}

.upload-box.has-file .remove-btn{
  display:flex;
  align-items:center;
  justify-content:center;
}

.upload-icon{
  width:56px;
  height:56px;
  margin:0 auto 14px;
  border-radius:50%;
  background:rgba(59,130,246,.15);
  display:flex;
  align-items:center;
  justify-content:center;
}

.upload-icon svg{
  width:26px;
  height:26px;
  stroke:#3b82f6;
}

.upload-text strong{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}

.upload-text span{
  font-size:14px;
  color:#9ca3af;
}

/* LEVEL */
.level-box{ margin-top:20px; }

.level-option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:14px;
  background:#0f172a;
  border:1px solid #1f2937;
  cursor:pointer;
}

.level-option.active{
  border-color:#3b82f6;
  background:rgba(59,130,246,.15);
}

.check{
  opacity:0;
  color:#3b82f6;
}

.level-option.active .check{ opacity:1; }

/* BUTTON */
#compressBtn{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:600;
  background:#1f2937;
  color:#9ca3af;
  cursor:not-allowed;
}

#compressBtn.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  cursor:pointer;
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#9ca3af;
}

/* PROGRESS */
.progress{
  display:none;
  margin-top:14px;
}

.bar{
  height:6px;
  background:#1f2937;
  border-radius:6px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  transition:.3s;
}

@media(max-width:640px){
  .hero h1{ font-size:28px; }
}
</style>
</head>

<body>
<div class="container">

<div class="hero">
  <div class="brand">Develac PDF</div>
  <h1>Compress PDFs instantly</h1>
  <p>Fast, secure, no sign-up required.</p>
</div>

<div class="card">

<div class="upload-box" id="uploadBox">
  <input type="file" id="pdf" accept="application/pdf" />
  <button class="remove-btn" id="removePdf">×</button>

  <div class="upload-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 16V4"/>
      <path d="M7 9l5-5 5 5"/>
      <path d="M4 20h16"/>
    </svg>
  </div>

  <div class="upload-text" id="uploadText">
    <strong>Upload your PDF</strong>
    <span>Drag & drop or tap to browse</span>
  </div>
</div>

<div class="level-box">
  <div class="level-option active" data="medium">
    <span>Medium — Recommended</span>
    <span class="check">✓</span>
  </div>
  <div class="level-option" data="low">
    <span>Low — Highest quality</span>
    <span class="check">✓</span>
  </div>
  <div class="level-option" data="high">
    <span>High — Smallest size</span>
    <span class="check">✓</span>
  </div>
</div>

<button id="compressBtn">Compress & Download</button>

<div class="progress" id="progress">
  <div class="bar"><span id="bar"></span></div>
  <div class="status" id="progressText">Compressing PDF…</div>
</div>

<div class="status" id="status"></div>

</div>
</div>

<script>
const pdf=document.getElementById("pdf");
const uploadBox=document.getElementById("uploadBox");
const uploadText=document.getElementById("uploadText");
const removeBtn=document.getElementById("removePdf");
const btn=document.getElementById("compressBtn");
const status=document.getElementById("status");
const progress=document.getElementById("progress");
const bar=document.getElementById("bar");
const progressText=document.getElementById("progressText");

let level="medium";

/* LEVEL */
document.querySelectorAll(".level-option").forEach(o=>{
  o.onclick=()=>{
    document.querySelectorAll(".level-option").forEach(x=>x.classList.remove("active"));
    o.classList.add("active");
    level=o.dataset.level;
  };
});

/* FILE SELECT */
pdf.onchange=()=>{
  if(!pdf.files.length) return;
  const f=pdf.files[0];
  uploadText.innerHTML=`<strong>${f.name}</strong><span>${(f.size/1024/1024).toFixed(2)} MB</span>`;
  uploadBox.classList.add("has-file");
  btn.disabled=false;
  btn.classList.add("active");
};

/* REMOVE */
removeBtn.onclick=e=>{
  e.stopPropagation();
  pdf.value="";
  uploadBox.classList.remove("has-file");
  uploadText.innerHTML=`<strong>Upload your PDF</strong><span>Drag & drop or tap to browse</span>`;
  btn.disabled=true;
  btn.classList.remove("active");
  status.innerText="";
};

/* COMPRESS */
btn.onclick=()=>{
  if(!pdf.files.length) return;
  btn.disabled=true;
  btn.innerText="Compressing...";
  progress.style.display="block";
  bar.style.width="60%";

  const fd=new FormData();
  fd.append("pdf",pdf.files[0]);
  fd.append("level",level);

  fetch("https://develac-pdf-backend-production.up.railway.app/compress",{method:"POST",body:fd})
  .then(r=>r.blob())
  .then(b=>{
    bar.style.width="100%";
    const url=URL.createObjectURL(b);
    const a=document.createElement("a");
    a.href=url;
    a.download="compressed.pdf";
    a.click();
    URL.revokeObjectURL(url);

    status.innerHTML="✅ PDF compressed successfully";
    btn.innerText="Compress another PDF";
    btn.disabled=false;

    btn.onclick=()=>location.reload();
  })
  .catch(()=>{
    status.innerText="Compression failed";
    btn.disabled=false;
    btn.innerText="Compress & Download";
  });
};
</script>

</body>
</html>
