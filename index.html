<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Develac PDF — Compress PDFs Instantly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1220,#020617);
  color:#e5e7eb;
}

.container{
  max-width:960px;
  margin:auto;
  padding:40px 16px 80px;
}

/* HERO */
.hero{
  text-align:center;
  margin-bottom:40px;
}
.hero .brand{
  opacity:.85;
  margin-bottom:10px;
}
.hero h1{
  font-size:38px;
  margin-bottom:10px;
}
.hero p{
  color:#9ca3af;
}

/* CARD */
.card{
  max-width:520px;
  margin:0 auto;
  background:rgba(15,23,42,.75);
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* UPLOAD BOX */
.upload-box{
  position:relative;
  border:2px dashed #3b82f6;
  border-radius:18px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
}
.upload-box.hidden{display:none;}

.file-input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.remove-btn{
  position:absolute;
  top:12px;
  right:12px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(59,130,246,.5);
  background:transparent;
  color:#3b82f6;
  font-size:18px;
  cursor:pointer;
  display:none;
}

.upload-icon{
  width:60px;
  height:60px;
  margin:0 auto 12px;
  border-radius:50%;
  background:rgba(59,130,246,.15);
  display:flex;
  align-items:center;
  justify-content:center;
}

.upload-icon svg{
  width:28px;
  height:28px;
  stroke:#3b82f6;
}

.upload-text strong{
  display:block;
  font-size:16px;
}
.upload-text span{
  font-size:14px;
  color:#9ca3af;
}

/* LEVELS */
.level-box{
  margin-top:20px;
}
.level-option{
  padding:14px 16px;
  border-radius:14px;
  background:#0f172a;
  border:1px solid #1f2937;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}
.level-option.active{
  border-color:#3b82f6;
  background:rgba(59,130,246,.15);
}
.level-box.hidden{display:none;}

/* BUTTON */
#compressBtn{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:16px;
  background:#1f2937;
  color:#9ca3af;
}
#compressBtn.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  cursor:pointer;
}
#compressBtn.hidden{display:none;}

/* PROGRESS */
.progress-wrap{
  margin-top:20px;
  display:none;
}
.progress-bar-bg{
  height:6px;
  background:rgba(255,255,255,.15);
  border-radius:6px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
}
.progress-text{
  margin-top:8px;
  font-size:13px;
  color:#9ca3af;
  text-align:center;
}

/* SUCCESS */
.success-box{
  display:none;
  text-align:center;
}
.success-icon{
  width:64px;
  height:64px;
  margin:0 auto 12px;
  border-radius:50%;
  background:rgba(34,197,94,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#22c55e;
  font-size:32px;
}
.success-stats{
  margin:10px 0;
  color:#9ca3af;
  font-size:14px;
}
.download-btn{
  margin-top:16px;
  width:100%;
  padding:16px;
  border-radius:14px;
  background:#22c55e;
  color:#052e16;
  border:none;
  font-size:16px;
  font-weight:600;
}
.again-btn{
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:14px;
  background:transparent;
  border:1px solid #3b82f6;
  color:#3b82f6;
}
</style>
</head>

<body>
<div class="container">

<div class="hero">
  <div class="brand">Develac PDF</div>
  <h1>Compress PDFs instantly</h1>
  <p>Fast, secure, no sign-up required.</p>
</div>

<div class="card">

<!-- UPLOAD -->
<div class="upload-box" id="uploadBox">
  <input type="file" id="pdf" class="file-input" accept="application/pdf"/>
  <button class="remove-btn" id="removeBtn">×</button>

  <div class="upload-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 16V4"/>
      <path d="M7 9l5-5 5 5"/>
      <path d="M4 20h16"/>
    </svg>
  </div>

  <div class="upload-text" id="uploadText">
    <strong>Upload your PDF</strong>
    <span>Drag & drop or tap to browse</span>
  </div>
</div>

<!-- LEVEL -->
<div class="level-box" id="levelBox">
  <div class="level-option active" data="medium">
    <span>Medium — Recommended</span><span>✓</span>
  </div>
  <div class="level-option" data="low">
    <span>Low — Highest quality</span>
  </div>
  <div class="level-option" data="high">
    <span>High — Smallest size</span>
  </div>
</div>

<button id="compressBtn">Compress & Download</button>

<!-- PROGRESS -->
<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-bg">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText">0%</div>
</div>

<!-- SUCCESS -->
<div class="success-box" id="successBox">
  <div class="success-icon">✔</div>
  <h2>Your PDF is ready</h2>
  <div class="success-stats" id="stats"></div>
  <button class="download-btn" id="downloadBtn">Download Compressed PDF</button>
  <button class="again-btn" onclick="location.reload()">Compress another PDF</button>
</div>

</div>
</div>

<script>
const pdf=document.getElementById("pdf");
const uploadText=document.getElementById("uploadText");
const compressBtn=document.getElementById("compressBtn");
const progressWrap=document.getElementById("progressWrap");
const progressBar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");
const successBox=document.getElementById("successBox");
const uploadBox=document.getElementById("uploadBox");
const levelBox=document.getElementById("levelBox");
const stats=document.getElementById("stats");
const downloadBtn=document.getElementById("downloadBtn");

let originalSize=0;
let fakeProgress;

pdf.addEventListener("change",()=>{
  if(!pdf.files.length) return;
  const f=pdf.files[0];
  originalSize=f.size;
  uploadText.innerHTML=`<strong>${f.name}</strong><span>${(f.size/1024/1024).toFixed(2)} MB</span>`;
  compressBtn.classList.add("active");
});

compressBtn.onclick=()=>{
  uploadBox.classList.add("hidden");
  levelBox.classList.add("hidden");
  compressBtn.classList.add("hidden");
  progressWrap.style.display="block";

  let p=0;
  fakeProgress=setInterval(()=>{
    p+=Math.random()*8;
    if(p>=95){p=95;}
    progressBar.style.width=p+"%";
    progressText.innerText=Math.floor(p)+"%";
  },400);

  fetch("https://develac-pdf-backend-production.up.railway.app/compress",{
    method:"POST",
    body:new FormData(document.querySelector("form"))
  }).then(r=>r.blob()).then(blob=>{
    clearInterval(fakeProgress);
    progressBar.style.width="100%";
    progressText.innerText="100%";

    const compressedSize=blob.size;
    const saved=((originalSize-compressedSize)/originalSize*100).toFixed(1);

    stats.innerHTML=`
      Original: ${(originalSize/1024/1024).toFixed(2)} MB<br>
      Compressed: ${(compressedSize/1024/1024).toFixed(2)} MB<br>
      Reduced: ${saved}%`;

    progressWrap.style.display="none";
    successBox.style.display="block";

    const url=URL.createObjectURL(blob);
    downloadBtn.onclick=()=>{
      const a=document.createElement("a");
      a.href=url;
      a.download="compressed.pdf";
      a.click();
    };
  });
};
</script>
</body>
</html>
