<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Develac PDF — Compress PDFs Instantly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1220,#020617);
  color:#e5e7eb;
}

.container{
  max-width:960px;
  margin:auto;
  padding:40px 16px 80px;
}

/* HERO */
.hero{text-align:center;margin-bottom:40px;}
.brand{opacity:.9;margin-bottom:10px;font-weight:600;}
.hero h1{font-size:40px;margin-bottom:10px;}
.hero p{color:#9ca3af;}

/* CARD */
.card{
  max-width:520px;
  margin:0 auto;
  background:rgba(15,23,42,.7);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* UPLOAD BOX */
.upload-box{
  position:relative;
  border:2px dashed #3b82f6;
  border-radius:16px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
  transition:.25s;
}
.upload-box:hover{background:rgba(59,130,246,.08);}
.upload-box.has-file{
  border-color:#60a5fa;
  background:rgba(59,130,246,.12);
}

/* FILE INPUT (FULL OVERLAY – MOBILE SAFE) */
.file-input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
  z-index:2;
}

/* REMOVE BUTTON */
.remove-btn{
  position:absolute;
  top:12px;
  right:12px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(59,130,246,.5);
  background:transparent;
  color:#3b82f6;
  font-size:16px;
  cursor:pointer;
  display:none;
  z-index:3;
}
.upload-box.has-file .remove-btn{display:flex;align-items:center;justify-content:center;}

.upload-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(59,130,246,.15);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
}
.upload-icon svg{width:26px;height:26px;stroke:#3b82f6;}

.upload-text strong{display:block;margin-bottom:4px;}
.upload-text span{color:#9ca3af;font-size:14px;}

/* LEVEL */
.level-box{margin-top:20px;}
.level-option{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;margin-bottom:10px;
  border-radius:14px;
  background:#0f172a;border:1px solid #1f2937;
  cursor:pointer;
}
.level-option.active{
  border-color:#3b82f6;
  background:rgba(59,130,246,.15);
}
.check{opacity:0;color:#3b82f6;font-weight:600;}
.level-option.active .check{opacity:1;}

/* BUTTON */
#compressBtn{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:none;
  background:#1f2937;
  color:#9ca3af;
  font-size:16px;
  cursor:not-allowed;
}
#compressBtn.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  cursor:pointer;
}

/* PROGRESS */
.progress-wrap{
  width:100%;
  height:6px;
  background:rgba(255,255,255,.1);
  border-radius:6px;
  overflow:hidden;
  margin-top:14px;
  display:none;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  transition:width .4s;
}

/* STATUS */
.status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#9ca3af;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:none}
}

@media(max-width:640px){
  .hero h1{font-size:28px;}
}
</style>
</head>

<body>
<div class="container">

<div class="hero">
  <div class="brand">Develac PDF</div>
  <h1>Compress PDFs instantly</h1>
  <p>Fast, secure, no sign-up required.</p>
</div>

<div class="card">

<div class="upload-box" id="uploadBox">
  <input type="file" id="pdf" class="file-input" accept="application/pdf">
  <button class="remove-btn" id="removePdf">×</button>

  <div class="upload-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 16V4"/>
      <path d="M7 9l5-5 5 5"/>
      <path d="M4 20h16"/>
    </svg>
  </div>

  <div class="upload-text" id="uploadText">
    <strong>Upload your PDF</strong>
    <span>Drag & drop or tap to browse</span>
  </div>
</div>

<div class="level-box">
  <div class="level-option active" data="medium">
    <span>Medium — Recommended</span>
    <span class="check">✓</span>
  </div>
  <div class="level-option" data="low">
    <span>Low — Highest quality</span>
    <span class="check">✓</span>
  </div>
  <div class="level-option" data="high">
    <span>High — Smallest size</span>
    <span class="check">✓</span>
  </div>
</div>

<button id="compressBtn">Compress & Download</button>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="status" id="status"></div>

</div>
</div>

<script>
const pdf = document.getElementById("pdf");
const uploadBox = document.getElementById("uploadBox");
const uploadText = document.getElementById("uploadText");
const removeBtn = document.getElementById("removePdf");
const btn = document.getElementById("compressBtn");
const status = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");

let level = "medium";
let timer = null;

/* LEVEL SELECT */
document.querySelectorAll(".level-option").forEach(o=>{
  o.onclick=()=>{
    document.querySelectorAll(".level-option").forEach(x=>x.classList.remove("active"));
    o.classList.add("active");
    level=o.dataset.level;
  }
});

/* FILE SELECT */
pdf.onchange=()=>{
  if(!pdf.files.length) return;
  const f=pdf.files[0];
  uploadText.innerHTML=`<strong>${f.name}</strong><span>${(f.size/1024/1024).toFixed(2)} MB</span>`;
  uploadBox.classList.add("has-file");
  btn.disabled=false;
  btn.classList.add("active");
};

/* REMOVE */
removeBtn.onclick=(e)=>{
  e.stopPropagation();
  pdf.value="";
  uploadBox.classList.remove("has-file");
  uploadText.innerHTML=`<strong>Upload your PDF</strong><span>Drag & drop or tap to browse</span>`;
  btn.disabled=true;
  btn.classList.remove("active");
  progressWrap.style.display="none";
  status.innerText="";
};

/* COMPRESS */
btn.onclick=()=>{
  if(!pdf.files.length) return;

  btn.innerText="Compressing…";
  btn.disabled=true;
  progressWrap.style.display="block";
  progressBar.style.width="0%";
  status.innerText="Compressing PDF…";

  let p=0;
  timer=setInterval(()=>{
    if(p<90){p+=Math.random()*8;progressBar.style.width=p+"%";}
  },400);

  const fd=new FormData();
  fd.append("pdf",pdf.files[0]);
  fd.append("level",level);

  fetch("https://develac-pdf-backend-production.up.railway.app/compress",{method:"POST",body:fd})
  .then(r=>r.blob())
  .then(b=>{
    clearInterval(timer);
    progressBar.style.width="100%";

    const url=URL.createObjectURL(b);
    const a=document.createElement("a");
    a.href=url;a.download="compressed.pdf";a.click();
    URL.revokeObjectURL(url);

    btn.innerText="Compress & Download";
    btn.disabled=false;
    status.innerHTML="✅ PDF compressed successfully";
  })
  .catch(()=>{
    clearInterval(timer);
    btn.innerText="Compress & Download";
    btn.disabled=false;
    status.innerText="❌ Compression failed. Try again.";
  });
};
</script>

</body>
</html>
