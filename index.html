<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Develac PDF — Smart & Secure PDF Compressor</title>

<style>
/* ========== BASE ========== */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  background:radial-gradient(circle at top,#0b1220,#020617);
  color:#e5e7eb;
  min-height:100vh;
}
.container{max-width:960px;margin:auto;padding:40px 16px}

/* ========== HERO ========== */
.hero{text-align:center;margin-bottom:36px}
.hero h1{font-size:36px;margin-bottom:10px}
.hero p{color:#9ca3af}

/* ========== CARD ========== */
.card{
  max-width:520px;
  margin:auto;
  background:rgba(15,23,42,.7);
  border-radius:20px;
  padding:28px;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 30px 80px rgba(0,0,0,.6)
}

/* ========== UPLOAD BOX (Lovable style) ========== */
.upload-box{
  border:2px dashed #3b82f6;
  border-radius:16px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s
}
.upload-box:hover{background:rgba(59,130,246,.08)}
.upload-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(59,130,246,.15);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px
}
.upload-icon svg{width:26px;color:#3b82f6}
.upload-text strong{display:block;font-size:16px}
.upload-text span{font-size:14px;color:#9ca3af}

/* ========== LEVEL UI ========== */
.level-box{margin-top:20px}
.level-option{
  display:flex;justify-content:space-between;
  padding:14px;border-radius:14px;
  background:#0f172a;border:1px solid #1f2937;
  cursor:pointer;margin-bottom:10px
}
.level-option.active{
  border-color:#3b82f6;
  background:rgba(59,130,246,.15)
}
.check{color:#3b82f6;opacity:0}
.level-option.active .check{opacity:1}

/* ========== BUTTON ========== */
#compressBtn{
  width:100%;margin-top:16px;
  padding:16px;border-radius:14px;
  border:none;font-size:16px;font-weight:600;
  background:#1f2937;color:#9ca3af;
  cursor:not-allowed
}
#compressBtn.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;cursor:pointer
}

.status{text-align:center;font-size:14px;margin-top:10px;color:#9ca3af}
footer{text-align:center;margin-top:60px;font-size:13px;color:#6b7280}
footer a{color:#9ca3af;text-decoration:none;margin:0 6px}
</style>
</head>

<body>
<div class="container">

<div class="hero">
<h1>Compress PDFs instantly</h1>
<p>Fast, secure, and private PDF compression.</p>
</div>

<div class="card">

<label class="upload-box" for="pdf">
  <div class="upload-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 16V4M7 9l5-5 5 5"/>
    </svg>
  </div>
  <div class="upload-text" id="uploadText">
    <strong>Upload your PDF</strong>
    <span>Drag & drop or tap to browse</span>
  </div>
</label>

<input type="file" id="pdf" accept="application/pdf" hidden>

<div class="level-box">
  <div class="level-option active" data="medium">
    <span>Medium — Recommended</span><span class="check">✓</span>
  </div>
  <div class="level-option" data="low">
    <span>Low — Highest quality</span><span class="check">✓</span>
  </div>
  <div class="level-option" data="high">
    <span>High — Smallest size</span><span class="check">✓</span>
  </div>
</div>

<button id="compressBtn" onclick="goProcess()" disabled>
⚡ Compress & Download PDF
</button>

<div class="status" id="status"></div>

</div>

<footer>
© 2026 Develac PDF —
<a href="privacy.html">Privacy</a> ·
<a href="terms.html">Terms</a>
</footer>

</div>
<script>
const pdf = document.getElementById("pdf");
const uploadText = document.getElementById("uploadText");
const btn = document.getElementById("compressBtn");
const status = document.getElementById("status");

let level = "medium";

/* compression level select */
document.querySelectorAll(".level-option").forEach(o => {
  o.addEventListener("click", () => {
    document.querySelectorAll(".level-option").forEach(x =>
      x.classList.remove("active")
    );
    o.classList.add("active");
    level = o.getAttribute("data");
  });
});

/* file select */
pdf.addEventListener("change", () => {
  if (!pdf.files.length) return;

  const f = pdf.files[0];

  uploadText.innerHTML = `
    <strong>${f.name}</strong>
    <span>${(f.size / 1024 / 1024).toFixed(2)} MB</span>
  `;

  btn.disabled = false;
  btn.classList.add("active");
  status.innerText = "";
});

/* go to processing page */
function goProcess() {
  if (!pdf.files.length) {
    alert("Please select a PDF file");
    return;
  }

  // save data for next page
  sessionStorage.setItem("pdfFile", pdf.files[0]);
  sessionStorage.setItem("level", level);

  window.location.href = "processing.html";
}
</script>
</body>
</html>
