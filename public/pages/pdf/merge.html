<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDF – Develac</title>

  <!-- GLOBAL STYLES -->
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/header.css">
  <link rel="stylesheet" href="/assets/css/cookie.css">

  <style>
    .page{
      max-width:760px;
      margin:auto;
      padding:32px 16px 40px;
    }

    h1{
      text-align:center;
      font-size:30px;
      margin-bottom:6px;
    }

    .sub{
      text-align:center;
      font-size:15px;
      color:var(--text-muted);
      margin-bottom:32px;
    }

    .card{
      background:#fff;
      border-radius:26px;
      padding:26px 20px;
      margin-bottom:24px;
    }

    /* UPLOAD */
    .upload-card{
      border:2px dashed #e5e7eb;
      text-align:center;
      cursor:pointer;
    }

    .upload-icon{
      width:66px;
      height:66px;
      margin:6px auto 16px;
      background:#eef2ff;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .upload-title{
      font-size:18px;
      font-weight:600;
    }

    .upload-sub{
      font-size:14px;
      color:var(--text-muted);
    }

    /* FILE LIST */
    .file-list{
      display:none;
      margin-top:16px;
    }

    .add-more-btn{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border-radius:14px;
      border:1px dashed #2563eb;
      background:#eef2ff;
      color:#2563eb;
      font-weight:600;
      cursor:pointer;
    }

    .file-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 14px;
      border:1px solid #e5e7eb;
      border-radius:16px;
      margin-bottom:10px;
      gap:10px;
    }

    .file-name{
      font-size:14px;
      font-weight:500;
      max-width:220px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .file-size{
      font-size:13px;
      color:var(--text-muted);
    }

    .file-actions{
      display:flex;
      gap:6px;
    }

    .icon-btn{
      border:none;
      background:#f1f5f9;
      border-radius:10px;
      padding:6px 8px;
      cursor:pointer;
    }

    /* BUTTON */
    .main-btn{
      width:100%;
      padding:16px;
      border-radius:16px;
      font-size:16px;
      font-weight:600;
      border:none;
      background:#2563eb;
      color:#fff;
      cursor:pointer;
    }

    .main-btn:disabled{
      background:#9db8f5;
      cursor:not-allowed;
    }

    /* PROGRESS */
    .progress-box{
      display:none;
      margin-top:20px;
    }

    .progress-bar{
      width:100%;
      height:10px;
      background:#e5e7eb;
      border-radius:20px;
      overflow:hidden;
    }

    .progress-fill{
      width:0%;
      height:100%;
      background:#2563eb;
      transition:width .4s ease;
    }

    /* SUCCESS */
    .success{
      display:none;
      background:#0b1220;
      color:#e5e7eb;
      border-radius:26px;
      padding:36px 24px;
      text-align:center;
    }

    .success h2{
      color:#22c55e;
      margin-bottom:14px;
    }

    .summary{
      font-size:14px;
      color:#9ca3af;
      margin-bottom:22px;
    }
  </style>
</head>

<body>

<div id="header-container"></div>

<div class="page">

  <h1>Merge PDF</h1>
  <div class="sub">Combine multiple PDF files into one document securely.</div>

  <!-- UPLOAD -->
  <label class="card upload-card" id="uploadCard">
    <input type="file" id="fileInput" accept="application/pdf" multiple hidden>

    <div class="upload-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
        <path d="M12 3v12"/>
        <path d="M7 8l5-5 5 5"/>
        <rect x="4" y="15" width="16" height="6"/>
      </svg>
    </div>

    <div class="upload-title">Select PDF files</div>
    <div class="upload-sub">Up to 10 files · Max 20MB each</div>
  </label>

  <!-- FILE LIST -->
  <div class="file-list" id="fileList">
    <button class="add-more-btn" onclick="addMoreFiles()">+ Add more files</button>
  </div>

  <button class="main-btn" id="mergeBtn" disabled>Merge PDF</button>

  <!-- PROGRESS -->
  <div class="progress-box" id="progressBox">
    <div id="progressText">Processing… 0%</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="success" id="successBox">
    <h2>Merge Complete</h2>
    <div class="summary" id="summaryText"></div>

    <button class="main-btn" id="downloadBtn">Download PDF</button>
    <button class="main-btn" style="background:#fff;color:#111;margin-top:10px"
      onclick="location.reload()">Merge another</button>
  </div>

</div>

<footer class="footer">
  © 2026 Develac ·
  <a href="/pages/privacy.html">Privacy</a> ·
  <a href="/pages/terms.html">Terms</a>
</footer>

<script src="/assets/js/header.js"></script>
<script src="/assets/js/cookie.js" defer></script>

<script>
let files = [];

const uploadCard = document.getElementById("uploadCard");
const fileInput = document.getElementById("fileInput");
const fileListEl = document.getElementById("fileList");
const mergeBtn = document.getElementById("mergeBtn");
const progressBox = document.getElementById("progressBox");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const successBox = document.getElementById("successBox");
const summaryText = document.getElementById("summaryText");

uploadCard.onclick = () => fileInput.click();

fileInput.onchange = () => {
  Array.from(fileInput.files).forEach(f=>{
    if(files.length < 10) files.push(f);
  });
  renderFiles();
};

function addMoreFiles(){
  fileInput.click();
}

function renderFiles(){
  fileListEl.style.display = "block";
  fileListEl.innerHTML = `<button class="add-more-btn" onclick="addMoreFiles()">+ Add more files</button>`;

  files.forEach((f,i)=>{
    fileListEl.innerHTML += `
      <div class="file-item">
        <div>
          <div class="file-name">${f.name}</div>
          <div class="file-size">${(f.size/1024/1024).toFixed(2)} MB</div>
        </div>
        <div class="file-actions">
          <button class="icon-btn" onclick="moveUp(${i})">↑</button>
          <button class="icon-btn" onclick="moveDown(${i})">↓</button>
          <button class="icon-btn" onclick="removeFile(${i})">✕</button>
        </div>
      </div>
    `;
  });

  mergeBtn.disabled = files.length < 2;
}

function removeFile(i){
  files.splice(i,1);
  files.length ? renderFiles() : location.reload();
}

function moveUp(i){
  if(i===0) return;
  [files[i-1],files[i]]=[files[i],files[i-1]];
  renderFiles();
}

function moveDown(i){
  if(i===files.length-1) return;
  [files[i+1],files[i]]=[files[i],files[i+1]];
  renderFiles();
}

mergeBtn.onclick = async ()=>{
  progressBox.style.display="block";
  let percent=0;
  const interval=setInterval(()=>{
    if(percent<90){
      percent+=5;
      progressFill.style.width=percent+"%";
      progressText.innerText=`Processing… ${percent}%`;
    }
  },300);

  const fd=new FormData();
  files.forEach(f=>fd.append("pdfs[]",f));

  try{
    const res=await fetch("https://api.develac.com/merge",{method:"POST",body:fd});
    if(!res.ok) throw new Error();
    const blob=await res.blob();

    clearInterval(interval);
    progressFill.style.width="100%";
    progressText.innerText="Processing… 100%";

    summaryText.innerText=`${files.length} files merged successfully`;
    document.getElementById("downloadBtn").onclick=()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="merged.pdf";
      a.click();
    };

    successBox.style.display="block";
  }catch{
    alert("Merge failed. Please try again.");
    location.reload();
  }
};
</script>

</body>
</html>
