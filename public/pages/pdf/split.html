<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Split PDF – Develac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #0f172a;
    }

    /* ---------- HEADER ---------- */
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
    }

    .header span {
      font-size: 18px;
    }

    /* ---------- CONTAINER ---------- */
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* ---------- UPLOAD CARD ---------- */
    .upload-card {
      border: 2px dashed #e5e7eb;
      border-radius: 26px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
    }

    .upload-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      background: #eef2ff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon svg {
      width: 30px;
      height: 30px;
      stroke: #2563eb;
    }

    .upload-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-desc {
      font-size: 14px;
      color: #64748b;
    }

    .file-item {
      margin-top: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: 600;
      cursor: pointer;
    }

    /* ---------- OPTIONS ---------- */
    .options {
      margin-top: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 14px;
    }

    .option {
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .option.active {
      border-color: #2563eb;
      background: #eef2ff;
    }

    .range-input {
      display: none;
      margin-top: 10px;
    }

    .range-input input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 0 12px;
    }

    /* ---------- BUTTON ---------- */
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      margin-top: 18px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #a5bdf6;
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-top: 28px;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 6px;
    }

    input[type="file"],
    input[type="radio"] {
      display: none;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    ←
    <span>Develac</span>
    ☰
  </div>

  <div class="container">

    <h1>Split PDF</h1>
    <div class="subtitle">
      Split a PDF into multiple files. Fast, secure and privacy-first.
    </div>

    <!-- UPLOAD -->
    <div id="uploadCard" class="upload-card">
      <div class="upload-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v4h16v-4" />
        </svg>
      </div>

      <div class="upload-title">Select PDF file to split</div>
      <div class="upload-desc">Maximum file size: 100MB</div>

      <input id="fileInput" type="file" accept="application/pdf" />
      <div id="fileItem"></div>
    </div>

    <!-- OPTIONS -->
    <div class="options">
      <div id="optEach" class="option active">
        <input type="radio" name="splitMode" checked />
        Split each page into separate PDF
      </div>

      <div id="optRange" class="option">
        <input type="radio" name="splitMode" />
        Split by page range
      </div>

      <div id="rangeInput" class="range-input">
        <input type="text" placeholder="Pages (example: 1-3, 5, 8-10)">
      </div>
    </div>

    <button id="splitBtn" class="btn btn-primary" disabled>
      Split PDF
    </button>

    <footer>
      © 2026 Develac ·
      <a href="#">Privacy</a> ·
      <a href="#">Terms</a>
    </footer>

  </div>

  <script>
    const uploadCard = document.getElementById("uploadCard");
    const fileInput = document.getElementById("fileInput");
    const fileItem = document.getElementById("fileItem");
    const splitBtn = document.getElementById("splitBtn");

    const optEach = document.getElementById("optEach");
    const optRange = document.getElementById("optRange");
    const rangeInput = document.getElementById("rangeInput");

    uploadCard.onclick = () => fileInput.click();

    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if (!file) return;

      fileItem.innerHTML = `
        <div class="file-item">
          <span>${file.name}</span>
          <button class="remove-btn">Remove</button>
        </div>
      `;

      fileItem.querySelector("button").onclick = () => {
        fileItem.innerHTML = "";
        splitBtn.disabled = true;
      };

      splitBtn.disabled = false;
    };

    optEach.onclick = () => {
      optEach.classList.add("active");
      optRange.classList.remove("active");
      rangeInput.style.display = "none";
    };

    optRange.onclick = () => {
      optRange.classList.add("active");
      optEach.classList.remove("active");
      rangeInput.style.display = "block";
    };
  </script>

</body>
</html>
