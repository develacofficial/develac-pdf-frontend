<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Split PDF – Develac</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Develac</a>
      <div class="menu-icon">☰</div>
    </div>
  </header>

  <!-- ================= TOOL HERO ================= -->
  <section class="tool-hero">
    <h1>Split PDF</h1>
    <p>
      Separate one PDF into multiple files by pages or ranges.
    </p>
  </section>

  <!-- ================= TOOL CARD ================= -->
  <section class="tool-section">

    <div class="tool-card-main">

      <!-- Upload Box -->
      <div class="upload-box">
        <div class="upload-icon">⬆️</div>
        <div class="upload-text">
          <strong>Select a PDF file</strong>
          <span>Choose one PDF to split</span>
        </div>
      </div>

      <!-- Split Options (UI only) -->
      <div class="split-options">

        <div class="split-option active">
          <strong>Split by pages</strong>
          <span>Each page becomes a separate PDF</span>
        </div>

        <div class="split-option">
          <strong>Split by range</strong>
          <span>Example: 1-3, 4-6, 7-10</span>
        </div>

      </div>

      <!-- Action Button -->
      <button class="primary-btn">
        Split PDF
      </button>

    </div>

  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    © 2026 Develac ·
    <a href="/pages/privacy.html">Privacy</a> ·
    <a href="/pages/terms.html">Terms</a>
  </footer>

</body>
</html>
