<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compress PDF – Develac</title>

<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/header.css">
<link rel="stylesheet" href="/assets/css/cookie.css">

<style>
.page{max-width:760px;margin:auto;padding:32px 18px 40px}
h1{text-align:center;font-size:30px;margin-bottom:8px}
.sub{text-align:center;color:var(--text-muted);font-size:15px;margin-bottom:34px}

.card{background:#fff;border-radius:26px;padding:28px 22px;margin-bottom:26px}

/* UPLOAD */
.upload-card{
  width:100%;
  border:2px dashed #e5e7eb;
  border-radius:26px;
  text-align:center;
  cursor:pointer;
  padding:24px 16px;
}
.upload-icon{width:66px;height:66px;margin:6px auto 18px;background:#eef2ff;border-radius:18px;display:flex;align-items:center;justify-content:center}
.upload-icon svg{width:30px;height:30px;stroke:#2563eb}

.file-preview{
  display:none;
  margin-top:18px;
  padding:12px 14px;
  border:1px solid #e5e7eb;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:13px;color:var(--text-muted)}
.remove-btn{background:none;border:none;color:#ef4444;font-weight:600;cursor:pointer}

/* LEVEL */
.level-card{border:1px solid #e5e7eb}
.level-option{
  display:flex;
  gap:12px;
  padding:16px;
  border-radius:18px;
  cursor:pointer;
  border:2px solid transparent;
  margin-bottom:12px;
}
.level-option input{accent-color:#2563eb}
.level-option.active{background:#eef2ff;border-color:#2563eb}

/* BUTTON */
.main-btn{width:100%;padding:16px;border-radius:16px;font-size:16px;font-weight:600;border:none;background:#2563eb;color:#fff;cursor:pointer}
.main-btn:disabled{background:#9db8f5;cursor:not-allowed}
</style>
</head>

<body>

<div id="header-container"></div>

<div class="page">
<h1>Compress PDF</h1>
<div class="sub">Reduce PDF file size without losing quality.</div>

<!-- UPLOAD -->
<label class="card upload-card">
  <input type="file" id="fileInput" accept="application/pdf" hidden>

  <div class="upload-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><rect x="4" y="15" width="16" height="6"/>
    </svg>
  </div>

  <div><strong>Click or tap to select PDF</strong></div>
  <div class="file-preview" id="filePreview">
    <div>
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>
    <button type="button" class="remove-btn" onclick="removeFile()">Remove</button>
  </div>
</label>

<!-- LEVEL -->
<div class="card level-card">
  <label class="level-option active">
    <input type="radio" name="level" value="medium" checked>
    <div><strong>Medium</strong><div>Recommended</div></div>
  </label>

  <label class="level-option">
    <input type="radio" name="level" value="low">
    <div><strong>Low</strong><div>Best quality</div></div>
  </label>

  <label class="level-option">
    <input type="radio" name="level" value="high">
    <div><strong>High</strong><div>Smaller size</div></div>
  </label>
</div>

<button class="main-btn" id="compressBtn" disabled>Compress PDF</button>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("filePreview");
const nameEl = document.getElementById("fileName");
const sizeEl = document.getElementById("fileSize");
const btn = document.getElementById("compressBtn");

let selectedFile = null;
let selectedLevel = "medium";

fileInput.addEventListener("change",()=>{
  const file = fileInput.files[0];
  if(!file) return;

  selectedFile = file;
  nameEl.textContent = file.name;
  sizeEl.textContent = (file.size/1024/1024).toFixed(2)+" MB";
  preview.style.display="flex";
  btn.disabled=false;
});

function removeFile(){
  fileInput.value="";
  preview.style.display="none";
  btn.disabled=true;
  selectedFile=null;
}

document.querySelectorAll(".level-option").forEach(opt=>{
  opt.onclick=()=>{
    document.querySelectorAll(".level-option").forEach(o=>o.classList.remove("active"));
    opt.classList.add("active");
    opt.querySelector("input").checked=true;
    selectedLevel = opt.querySelector("input").value;
  }
});
</script>

</body>
</html>
