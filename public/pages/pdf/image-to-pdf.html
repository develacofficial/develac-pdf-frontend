<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image to PDF – Develac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- GLOBAL HEADER -->
  <link rel="stylesheet" href="/assets/css/header.css" />
  <script src="/assets/js/header.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #0f172a;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* ---------- UPLOAD CARD ---------- */
    .upload-card {
      border: 2px dashed #e5e7eb;
      border-radius: 26px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 22px;
      transition: background 0.2s, opacity 0.2s;
    }

    .upload-card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .upload-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      background: #eef2ff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon svg {
      width: 32px;
      height: 32px;
      stroke: #2563eb;
    }

    .upload-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
    }

    .file-list {
      margin-top: 14px;
      text-align: left;
    }

    .file-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .file-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 10px;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: 600;
      cursor: pointer;
    }

    /* ---------- FORMAT OPTIONS ---------- */
    .options {
      border: 1px solid #e5e7eb;
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .option {
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .option:last-child {
      margin-bottom: 0;
    }

    .option.active {
      border-color: #2563eb;
      background: #eef2ff;
    }

    .option input {
      accent-color: #2563eb;
    }

    /* ---------- BUTTON ---------- */
    .btn {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:disabled {
      background: #a5bdf6;
      cursor: not-allowed;
    }

    /* ---------- PROGRESS ---------- */
    .progress-text {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-fill {
      height: 100%;
      width: 40%;
      background: #2563eb;
    }

    /* ---------- SUCCESS ---------- */
    .success-card {
      background: #020617;
      border-radius: 28px;
      padding: 30px 24px;
      color: #ffffff;
      text-align: center;
      display: none;
    }

    .success-title {
      color: #22c55e;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub {
      color: #c7f9cc;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .btn-light {
      background: #ffffff;
      color: #0f172a;
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-top: 30px;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 6px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>

  <!-- GLOBAL HEADER -->
  <div id="header-container"></div>

  <div class="container">

    <h1>Image to PDF</h1>
    <div class="subtitle">
      Convert JPG or PNG images into a single PDF file. Fast and secure.
    </div>

    <!-- MAIN AREA -->
    <div id="mainArea">

      <!-- UPLOAD -->
      <div id="uploadCard" class="upload-card">
        <div class="upload-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16l4-4 4 4m0-8v8m8-4v4H4" />
          </svg>
        </div>

        <div class="upload-title">Select image files</div>
        <div class="upload-desc">Multiple images will be combined into one PDF</div>

        <input id="fileInput" type="file" accept="image/jpeg,image/png" multiple />
        <div id="fileList" class="file-list"></div>
      </div>

      <!-- FORMAT OPTIONS -->
      <div class="options">
        <div id="optJpg" class="option active">
          <input type="radio" name="format" checked />
          <label>JPG</label>
        </div>

        <div id="optPng" class="option">
          <input type="radio" name="format" />
          <label>PNG</label>
        </div>
      </div>

      <button id="convertBtn" class="btn btn-primary" disabled>
        Convert to PDF
      </button>

      <div id="progressArea" style="display:none;">
        <div class="progress-text">Creating PDF…</div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

    </div>

    <!-- SUCCESS -->
    <div id="successCard" class="success-card">
      <div class="success-title">PDF is ready</div>
      <div class="success-sub">Your images were converted successfully.</div>

      <button class="btn btn-primary">Download PDF</button>
      <button id="resetBtn" class="btn btn-light">Convert more images</button>

      <div style="margin-top:16px; font-size:14px; color:#94a3b8;">
        Encrypted processing · Automatic file deletion
      </div>
    </div>

    <footer>
      © 2026 Develac ·
      <a href="#">Privacy</a> ·
      <a href="#">Terms</a>
    </footer>

  </div>

  <script>
    const uploadCard = document.getElementById("uploadCard");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const convertBtn = document.getElementById("convertBtn");
    const progressArea = document.getElementById("progressArea");
    const successCard = document.getElementById("successCard");
    const resetBtn = document.getElementById("resetBtn");
    const mainArea = document.getElementById("mainArea");

    const optJpg = document.getElementById("optJpg");
    const optPng = document.getElementById("optPng");

    let files = [];

    /* UPLOAD */
    uploadCard.onclick = () => fileInput.click();

    fileInput.onchange = () => {
      Array.from(fileInput.files).forEach(file => {
        if (!files.find(f => f.name === file.name)) {
          files.push(file);
        }
      });
      renderFiles();
      fileInput.value = "";
    };

    function renderFiles() {
      fileList.innerHTML = "";
      files.forEach((file, index) => {
        const div = document.createElement("div");
        div.className = "file-item";
        div.innerHTML = `
          <span class="file-name">${file.name}</span>
          <button class="remove-btn">Remove</button>
        `;
        div.querySelector("button").onclick = () => {
          files.splice(index, 1);
          renderFiles();
        };
        fileList.appendChild(div);
      });
      convertBtn.disabled = files.length === 0;
    }

    /* FORMAT SELECTION */
    function setFormat(active) {
      if (active === "jpg") {
        optJpg.classList.add("active");
        optPng.classList.remove("active");
      } else {
        optPng.classList.add("active");
        optJpg.classList.remove("active");
      }
    }

    optJpg.onclick = () => setFormat("jpg");
    optPng.onclick = () => setFormat("png");

    /* CONVERT */
    convertBtn.onclick = () => {
      uploadCard.classList.add("disabled");
      convertBtn.disabled = true;
      progressArea.style.display = "block";

      setTimeout(() => {
        mainArea.style.display = "none";
        progressArea.style.display = "none";
        successCard.style.display = "block";
      }, 2000);
    };

    resetBtn.onclick = () => location.reload();
  </script>

</body>
</html>
