<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All PDF Tools – Develac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/assets/css/header.css" />
  <script src="/assets/js/header.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #0f172a;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      font-size: 17px;
      color: #64748b;
      max-width: 600px;
      margin: 0 auto 48px;
      line-height: 1.6;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (min-width: 768px) {
      .tools-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 26px;
      }
    }

    .tool-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      color: inherit;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      border-color: #dbeafe;
    }

    .tool-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      background: #eef2ff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-icon img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .tool-title {
      font-size: 17px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-top: 60px;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 6px;
    }
  </style>
</head>

<body>

<div id="header-container"></div>

<div class="container">

  <h1>All PDF Tools</h1>

  <div class="subtitle">
    Develac PDF – fast, secure and privacy-first tools
    to work with your documents.
  </div>

  <div class="tools-grid">

    <a href="/pages/pdf/compress.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/compress-pdf-icon.png" alt="Compress PDF">
      </div>
      <div class="tool-title">Compress PDF</div>
    </a>

    <a href="/pages/pdf/merge.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/merge-pdf-icon.png" alt="Merge PDF">
      </div>
      <div class="tool-title">Merge PDF</div>
    </a>

    <a href="/pages/pdf/split.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/split-pdf-icon.png" alt="Split PDF">
      </div>
      <div class="tool-title">Split PDF</div>
    </a>

    <a href="/pages/pdf/pdf-to-image.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/pdf-to-image-icon.png" alt="PDF to Image">
      </div>
      <div class="tool-title">PDF to Image</div>
    </a>

    <a href="/pages/pdf/image-to-pdf.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/image-to-pdf-icon.png" alt="Image to PDF">
      </div>
      <div class="tool-title">Image to PDF</div>
    </a>

    <a href="/pages/pdf/pdf-to-word.html" class="tool-card">
      <div class="tool-icon">
        <img src="/assets/icons/tools/pdf-to-word-icon.png" alt="PDF to Word">
      </div>
      <div class="tool-title">PDF to Word</div>
    </a>

  </div>

  <footer>
    © 2026 Develac ·
    <a href="#">Privacy</a> ·
    <a href="#">Terms</a>
  </footer>

</div>

</body>
</html>
