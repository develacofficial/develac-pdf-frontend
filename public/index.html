<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Develac – Smart PDF Tools</title>

  <link rel="stylesheet" href="/assets/css/header.css">

  <style>
    :root {
      --primary: #2563eb;
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --card: #f8fafc;
      --border: #e5e7eb;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { text-decoration: none; color: inherit; }

    .hero {
      padding: 48px 18px 36px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 26px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
    }

    .btn-secondary {
      border: 1px solid var(--border);
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Develac</div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <a href="/">Home</a>
    <a href="/pages/pdf/index.html">PDF Tools</a>
    <a href="/pages/privacy.html">Privacy</a>
    <a href="/pages/terms.html">Terms</a>
  </nav>
</header>

<section class="hero">
  <h1>Smart, Secure & Professional PDF Tools</h1>
  <p>Compress, merge, split and convert PDF files online — fast, secure and privacy-first.</p>

  <div class="hero-actions">
    <a href="/pages/pdf/compress.html" class="btn-primary">Compress PDF</a>
    <a href="/pages/pdf/index.html" class="btn-secondary">All PDF Tools</a>
  </div>
</section>

<footer>
  © 2026 Develac ·
  <a href="/pages/privacy.html">Privacy</a> ·
  <a href="/pages/terms.html">Terms</a>
</footer>

<script src="/assets/js/menu.js"></script>
</body>
</html>
