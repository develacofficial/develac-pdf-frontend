<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Merge PDF – Develac</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Develac</a>
      <div class="menu-icon">☰</div>
    </div>
  </header>

  <!-- ================= TOOL HERO ================= -->
  <section class="tool-hero">
    <h1>Merge PDF</h1>
    <p>
      Combine multiple PDF files into a single document in seconds.
    </p>
  </section>

  <!-- ================= TOOL CARD ================= -->
  <section class="tool-section">

    <div class="tool-card-main">

      <!-- Upload Box -->
      <div class="upload-box">
        <div class="upload-icon">⬆️</div>
        <div class="upload-text">
          <strong>Select PDF files</strong>
          <span>Minimum 2 files required</span>
        </div>
      </div>

      <!-- Selected Files Preview (UI only) -->
      <div class="file-list">
        <div class="file-item">
          <span>document-1.pdf</span>
        </div>
        <div class="file-item">
          <span>document-2.pdf</span>
        </div>

        <!-- Add more -->
        <div class="file-item add-more">
          <span>＋ Add more files</span>
        </div>
      </div>

      <!-- Action Button -->
      <button class="primary-btn">
        Merge PDF
      </button>

    </div>

  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    © 2026 Develac ·
    <a href="/pages/privacy.html">Privacy</a> ·
    <a href="/pages/terms.html">Terms</a>
  </footer>

</body>
</html>
