<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compress PDF – Develac</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Develac</a>
      <div class="menu-icon">☰</div>
    </div>
  </header>

  <!-- ================= TOOL HERO ================= -->
  <section class="tool-hero">
    <h1>Compress PDF</h1>
    <p>
      Reduce PDF file size while keeping the best possible quality.
    </p>
  </section>

  <!-- ================= TOOL CARD ================= -->
  <section class="tool-section">

    <div class="tool-card-main">

      <!-- Upload Box -->
      <div class="upload-box">
        <div class="upload-icon">⬆️</div>
        <div class="upload-text">
          <strong>Select PDF file</strong>
          <span>Drag & drop or click to upload</span>
        </div>
      </div>

      <!-- Compression Level -->
      <div class="level-box">
        <div class="level-option active">
          <span>Medium Compression</span>
          <span class="check">✓</span>
        </div>
        <div class="level-option">
          <span>Low Compression</span>
          <span class="check">✓</span>
        </div>
        <div class="level-option">
          <span>High Compression</span>
          <span class="check">✓</span>
        </div>
      </div>

      <!-- Action Button -->
      <button class="primary-btn">
        Compress PDF
      </button>

    </div>

  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    © 2026 Develac ·
    <a href="/pages/privacy.html">Privacy</a> ·
    <a href="/pages/terms.html">Terms</a>
  </footer>

</body>
</html>
